name: Build and Push Docker Image (Staging)

on:
  push:
    branches:
      - staging

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: frostzeichen/cmd-backend:latest
          cache-from: type=registry,ref=frostzeichen/cmd-backend:buildcache
          cache-to: type=registry,ref=frostzeichen/cmd-backend:buildcache,mode=max

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_S3_REGION }}

      - name: Install Lightsail CLI plugin
        run: |
          curl "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" -o "/usr/local/bin/lightsailctl"
          chmod +x /usr/local/bin/lightsailctl

      - name: Push image to Lightsail
        run: |
          docker pull frostzeichen/cmd-backend:latest
          aws lightsail push-container-image \
            --service-name ${{ secrets.LIGHTSAIL_SERVICE_NAME }} \
            --label cmd-backend \
            --image frostzeichen/cmd-backend:latest

      - name: Get image reference and deploy
        run: |
          # Get the latest image version
          IMAGE_REF=$(aws lightsail get-container-images --service-name ${{ secrets.LIGHTSAIL_SERVICE_NAME }} | jq -r '.containerImages[0].image')

          # Update deployment JSON with new image reference
          jq --arg img "$IMAGE_REF" '.containers["cmd-backend"].image = $img' lightsail-deployment.json > deployment-temp.json

          # Deploy to Lightsail
          aws lightsail create-container-service-deployment \
            --cli-input-json file://deployment-temp.json

          echo "Deployed image: $IMAGE_REF"
